name: Build anjayyy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        run: python3 generate_icons.py

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          
          # Direct download gradle-wrapper.jar dari GitHub
          echo "Downloading gradle-wrapper.jar..."
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" || \
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          
          # Verify file exists dan valid
          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar download failed"
            exit 1
          fi
          
          file android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          echo "✓ Gradle wrapper setup complete"
          
      - name: Setup gradle.properties
        run: |
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties

      - name: Clean Gradle Cache
        run: |
          cd android
          ./gradlew clean --no-daemon || true
          rm -rf .gradle build

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --parallel -x lint

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPro-APK
          path: output/SyncXxX.apk
          retention-days: 30
